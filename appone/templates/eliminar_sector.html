{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar Sector</h2>

    <!-- Bloque para mostrar mensajes de alerta (opcional, si lo usas en la vista) -->
    {% if alert %}
        <div class="alert alert-{{ alert.type }}" role="alert">
            {{ alert.message }}
        </div>
    {% endif %}

    <p>¿Estás seguro de que deseas eliminar el sector "<strong>{{ sector.descripcion }}</strong>"?<br>Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'lista_sectores' %}" class="btn btn-primary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
